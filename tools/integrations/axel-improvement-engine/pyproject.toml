[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axel-improvement-engine"
version = "0.1.0"
description = "Local-first, model-agnostic improvement ledger for Axel"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Axel" }]
dependencies = []

[project.scripts]
axel-improve = "axel_improve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
